<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵愈 - 治愈系记录</title>
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
    <!-- 开始界面 -->
    <div id="startScreen" class="start-screen">
        <div class="start-wallpaper" id="startWallpaper"></div>
        <div class="start-overlay">
            <!-- 小猫贴纸装饰 -->
            <div class="cat-sticker cat-sticker-1">😺</div>
            <div class="cat-sticker cat-sticker-2">😸</div>
            <div class="cat-sticker cat-sticker-3">😻</div>
            <div class="cat-sticker cat-sticker-4">😽</div>
            <div class="cat-sticker cat-sticker-5">🐱</div>
            <div class="cat-sticker cat-sticker-6">😼</div>
            
            <div class="start-content">
                <h1 class="start-title">喵愈</h1>
                <p class="start-subtitle">治愈你的每一天</p>
                <button id="startBtn" class="btn btn-start" style="padding: 28px 70px !important; font-size: 3em !important; border-radius: 55px !important; font-weight: 700 !important; letter-spacing: 4px;">📝 开始记日记</button>
            </div>
        </div>
    </div>

    <!-- 过渡画面 -->
    <div id="transitionScreen" class="transition-screen hidden">
        <div class="transition-content">
            <div class="loading-cat">
                <div class="cat-body"></div>
                <div class="cat-head">
                    <div class="cat-ear left"></div>
                    <div class="cat-ear right"></div>
                    <div class="cat-eye left"></div>
                    <div class="cat-eye right"></div>
                    <div class="cat-nose"></div>
                </div>
            </div>
            <p class="transition-text">正在准备你的日记本...</p>
        </div>
    </div>

    <div class="container hidden" id="mainContainer">
        <!-- 头部 -->
        <header class="header">
            <h1 class="logo">喵愈</h1>
            <p class="subtitle">治愈你的每一天</p>
        </header>

        <!-- 纯音乐按钮（左上角浮动） -->
        <button id="noiseToggleBtn" class="noise-toggle-btn" title="纯音乐">
            🎵
        </button>

        <!-- 情绪日历按钮（左上角浮动） -->
        <button id="calendarToggleBtn" class="calendar-toggle-btn" title="情绪日历">
            📅
        </button>

        <!-- 收藏按钮（左上角浮动） -->
        <button id="favoriteToggleBtn" class="favorite-toggle-btn" title="我的收藏">
            ⭐
        </button>

        <!-- 情绪日历模态框 -->
        <div id="calendarModal" class="modal hidden">
            <div class="modal-content calendar-modal">
                <div class="modal-header">
                    <h3> 情绪日历</h3>
                    <button class="close-btn" id="closeCalendarModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="calendar-notebook-selector">
                        <label class="selector-label">选择日记本：</label>
                        <select id="calendarNotebookSelect" class="notebook-select">
                            <option value="all">所有日记本</option>
                        </select>
                    </div>
                    <div class="calendar-header">
                        <button id="prevMonth" class="btn btn-small">◀</button>
                        <h4 id="currentMonth"></h4>
                        <button id="nextMonth" class="btn btn-small">▶</button>
                    </div>
                    <div class="calendar-weekdays">
                        <div class="weekday">日</div>
                        <div class="weekday">一</div>
                        <div class="weekday">二</div>
                        <div class="weekday">三</div>
                        <div class="weekday">四</div>
                        <div class="weekday">五</div>
                        <div class="weekday">六</div>
                    </div>
                    <div id="calendarDays" class="calendar-days"></div>
                </div>
            </div>
        </div>

        <!-- 日期日记查看模态框 -->
        <div id="dayDiaryModal" class="modal hidden">
            <div class="modal-content day-diary-modal">
                <div class="modal-header">
                    <h3 id="dayDiaryTitle">日记</h3>
                    <button class="close-btn" id="closeDayDiaryModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="dayDiaryList" class="day-diary-list"></div>
                </div>
            </div>
        </div>

        <!-- 纯音乐控制面板（模态框） -->
        <div id="noisePanel" class="noise-panel hidden">
            <div class="noise-panel-content">
                <div class="noise-panel-header">
                    <h3> 纯音乐</h3>
                    <button class="close-btn" id="closeNoisePanel">&times;</button>
                </div>
                <div class="noise-panel-body">
                    <div class="noise-controls">
                        <button id="playNoise" class="btn btn-primary">▶ 播放</button>
                        <button id="stopNoise" class="btn btn-secondary">⏹ 停止</button>
                    </div>
                    <div class="noise-options">
                        <label>
                            <input type="radio" name="noiseType" value="piano" checked> 月光奏鸣
                        </label>
                        <label>
                            <input type="radio" name="noiseType" value="guitar"> 微风轻语
                        </label>
                        <label>
                            <input type="radio" name="noiseType" value="flute"> 晨曦鸟鸣
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 收藏日记模态框 -->
        <div id="favoriteModal" class="modal hidden">
            <div class="modal-content favorite-modal">
                <div class="modal-header">
                    <h3>⭐ 我的收藏</h3>
                    <button class="close-btn" id="closeFavoriteModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="favoriteDiaryList" class="favorite-diary-list">
                        <p class="empty-tip">还没有收藏的日记哦~</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日记本管理区 -->
        <section class="notebooks-section">
            <div class="section-header">
                <h2>📚 我的日记本</h2>
                <div class="section-header-actions">
                    <button id="toggleNotebooksBtn" class="btn btn-small btn-toggle" title="收起/展开">▼</button>
                    <button id="newNotebookBtn" class="btn btn-small">+ 新建日记本</button>
                </div>
            </div>
            <div id="notebooksList" class="notebooks-list expanded">
                <!-- 日记本列表将在这里动态生成 -->
            </div>
        </section>

        <!-- 日记列表区 -->
        <section class="diaries-section">
            <div class="section-header">
                <h2> 日记列表 <span id="currentNotebookName" class="notebook-name-display"></span></h2>
                <div class="section-header-actions">
                    <button id="toggleDiariesBtn" class="btn btn-small btn-toggle" title="收起/展开">▼</button>
                    <button id="newDiaryBtn" class="btn btn-small" disabled>+ 新建日记</button>
                </div>
            </div>
            <div id="diariesList" class="diaries-list expanded">
                <p class="empty-tip">请先选择一个日记本</p>
            </div>
        </section>

        <!-- 新建日记本模态框 -->
        <div id="notebookModal" class="modal hidden">
            <div class="modal-content notebook-modal">
                <div class="modal-header">
                    <h3>📚 新建日记本</h3>
                    <button class="close-btn" id="closeNotebookModal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="notebookName" placeholder="请输入日记本名称..." class="input-field">
                    <div class="color-picker-section">
                        <label class="section-label">选择颜色：</label>
                        <div class="color-options">
                            <div class="color-option" data-color="#ffb6c1" style="background: #ffb6c1;" title="粉色"></div>
                            <div class="color-option" data-color="#ffcc99" style="background: #ffcc99;" title="橙色"></div>
                            <div class="color-option" data-color="#ffe680" style="background: #ffe680;" title="黄色"></div>
                            <div class="color-option" data-color="#b8e6b8" style="background: #b8e6b8;" title="绿色"></div>
                            <div class="color-option" data-color="#a8d8ea" style="background: #a8d8ea;" title="青色"></div>
                            <div class="color-option" data-color="#a8c8ff" style="background: #a8c8ff;" title="蓝色"></div>
                            <div class="color-option" data-color="#d8a8d8" style="background: #d8a8d8;" title="紫色"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="saveNotebook" class="btn btn-primary">保存</button>
                        <button id="cancelNotebook" class="btn btn-secondary">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 编辑日记本模态框 -->
        <div id="editNotebookModal" class="modal hidden">
            <div class="modal-content notebook-modal">
                <div class="modal-header">
                    <h3>✏️ 编辑日记本</h3>
                    <button class="close-btn" id="closeEditNotebookModal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="editNotebookName" placeholder="请输入日记本名称..." class="input-field">
                    <div class="modal-footer">
                        <button id="saveEditNotebook" class="btn btn-primary">保存</button>
                        <button id="cancelEditNotebook" class="btn btn-secondary">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 删除确认模态框 -->
        <div id="deleteConfirmModal" class="modal hidden">
            <div class="modal-content notebook-modal">
                <div class="modal-header">
                    <h3>🗑️ 确认删除</h3>
                    <button class="close-btn" id="closeDeleteModal">&times;</button>
                </div>
                <div class="modal-body">
                    <p id="deleteMessage" class="delete-message"></p>
                    <div class="modal-footer">
                        <button id="confirmDelete" class="btn btn-primary">确认删除</button>
                        <button id="cancelDelete" class="btn btn-secondary">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日记编辑器模态框 -->
        <div id="editorModal" class="modal hidden">
            <div class="modal-content editor-modal">
                <div class="modal-header">
                    <h3 id="modalTitle">编辑日记</h3>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="diaryTitle" placeholder="日记标题..." class="input-field">
                    <textarea id="diaryContent" placeholder="写下你的心情..." class="textarea-field"></textarea>
                    
                    <!-- 颜色选择 -->
                    <div class="color-picker-section">
                        <label class="section-label">选择颜色：</label>
                        <div class="color-options diary-color-options">
                            <div class="color-option" data-color="#ffb6c1" style="background: #ffb6c1;" title="粉色"></div>
                            <div class="color-option" data-color="#ffcc99" style="background: #ffcc99;" title="橙色"></div>
                            <div class="color-option" data-color="#ffe680" style="background: #ffe680;" title="黄色"></div>
                            <div class="color-option" data-color="#b8e6b8" style="background: #b8e6b8;" title="绿色"></div>
                            <div class="color-option" data-color="#a8d8ea" style="background: #a8d8ea;" title="青色"></div>
                            <div class="color-option" data-color="#a8c8ff" style="background: #a8c8ff;" title="蓝色"></div>
                            <div class="color-option" data-color="#d8a8d8" style="background: #d8a8d8;" title="紫色"></div>
                        </div>
                    </div>
                    
                    <!-- 心情选择 -->
                    <div class="mood-section">
                        <label class="section-label">心情：</label>
                        <div class="mood-options">
                            <div class="mood-option" data-mood="happy" data-icon="😺" title="开心">
                                <span class="mood-icon">😺</span>
                                <span class="mood-label">开心</span>
                            </div>
                            <div class="mood-option" data-mood="joy" data-icon="😸" title="喜悦">
                                <span class="mood-icon">😸</span>
                                <span class="mood-label">喜悦</span>
                            </div>
                            <div class="mood-option" data-mood="excited" data-icon="😻" title="兴奋">
                                <span class="mood-icon">😻</span>
                                <span class="mood-label">兴奋</span>
                            </div>
                            <div class="mood-option" data-mood="satisfied" data-icon="😽" title="满足">
                                <span class="mood-icon">😽</span>
                                <span class="mood-label">满足</span>
                            </div>
                            <div class="mood-option" data-mood="sad" data-icon="😿" title="难过">
                                <span class="mood-icon">😿</span>
                                <span class="mood-label">难过</span>
                            </div>
                            <div class="mood-option" data-mood="calm" data-icon="🐱" title="平静">
                                <span class="mood-icon">🐱</span>
                                <span class="mood-label">平静</span>
                            </div>
                            <div class="mood-option" data-mood="relaxed" data-icon="😺" title="放松">
                                <span class="mood-icon">😺</span>
                                <span class="mood-label">放松</span>
                            </div>
                            <div class="mood-option" data-mood="angry" data-icon="😾" title="愤怒">
                                <span class="mood-icon">😾</span>
                                <span class="mood-label">愤怒</span>
                            </div>
                            <div class="mood-option" data-mood="irritated" data-icon="😼" title="烦躁">
                                <span class="mood-icon">😼</span>
                                <span class="mood-label">烦躁</span>
                            </div>
                            <div class="mood-option" data-mood="anxious" data-icon="🙀" title="焦虑">
                                <span class="mood-icon">🙀</span>
                                <span class="mood-label">焦虑</span>
                            </div>
                            <div class="mood-option" data-mood="nervous" data-icon="😿" title="紧张">
                                <span class="mood-icon">😿</span>
                                <span class="mood-label">紧张</span>
                            </div>
                            <div class="mood-option" data-mood="confused" data-icon="🐈" title="迷茫">
                                <span class="mood-icon">🐈</span>
                                <span class="mood-label">迷茫</span>
                            </div>
                            <div class="mood-option custom-mood" data-mood="custom" title="自定义">
                                <span class="mood-icon">✏️</span>
                                <span class="mood-label">自定义</span>
                            </div>
                        </div>
                        <div id="customMoodInput" class="custom-mood-input hidden">
                            <input type="text" id="customMoodName" placeholder="输入心情名称..." class="input-field">
                            <input type="text" id="customMoodIcon" placeholder="输入表情符号（如：🌟）" class="input-field">
                        </div>
                        
                        <!-- 场景选择 -->
                        <div class="scene-section">
                            <label class="section-label">场景：</label>
                            <div class="scene-options">
                                <div class="scene-option" data-scene="fresh" title="清新">🍃 清新</div>
                                <div class="scene-option" data-scene="sunset" title="落日">🌅 落日</div>
                                <div class="scene-option" data-scene="rainy" title="雨夜">🌧️ 雨夜</div>
                                <div class="scene-option" data-scene="starry" title="星空">✨ 星空</div>
                                <div class="scene-option" data-scene="gentle" title="温柔静物">🌸 温柔静物</div>
                            </div>
                        </div>
                        
                        <!-- AI文案生成 -->
                        <div id="moodCopywriting" class="mood-copywriting hidden">
                            <div class="copywriting-header">
                                <span>💭 心情文案</span>
                            </div>
                            <div id="copywritingList" class="copywriting-list"></div>
                        </div>
                    </div>
                    
                    <!-- 日期选择 -->
                    <div class="date-section">
                        <label class="section-label">日期：</label>
                        <input type="date" id="diaryDate" class="input-field">
                    </div>
                    
                    <div class="modal-footer">
                        <button id="aiReplyBtn" class="btn btn-ai" title="获取AI共情回复">🐱 AI共情</button>
                        <button id="saveDiary" class="btn btn-primary">保存</button>
                        <button id="cancelEdit" class="btn btn-secondary">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI共情回复模态框 -->
        <div id="aiReplyModal" class="modal hidden">
            <div class="modal-content ai-reply-modal">
                <div class="modal-header">
                    <h3>🐱 喵愈AI共情</h3>
                    <button class="close-btn" id="closeAiReplyModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="aiReplyLoading" class="ai-reply-loading hidden">
                        <div class="loading-spinner"></div>
                        <p>喵愈AI正在思考...</p>
                    </div>
                    <div id="aiReplyContent" class="ai-reply-content"></div>
                </div>
                <div class="modal-footer">
                    <button id="copyAiReply" class="btn btn-small">复制回复</button>
                    <button id="closeAiReplyBtn" class="btn btn-secondary">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
